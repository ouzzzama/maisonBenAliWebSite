<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <path id="circleTextPath" d="M 110, 110 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" />
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF4136" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer White Frame -->
  <circle cx="110" cy="110" r="106" fill="#FFFFFF" filter="url(#shadow)" />
  
  <!-- Main Orange Circle -->
  <circle cx="110" cy="110" r="98" fill="#FF4136" />
  <circle cx="110" cy="110" r="97" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Inner Ring Line -->
  <circle cx="110" cy="110" r="54" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />

  <!-- Curved Text -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="3.2px" fill="#FFFFFF">
    <textPath href="#circleTextPath" startOffset="0%">
      25 ANS D'EXPÉRIENCE • MAISON BENALI •
    </textPath>
  </text>

  <!-- Center Number 25 -->
  <text x="110" y="112" font-family="'Plus Jakarta Sans', 'Cal Sans', Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">25</text>
</svg>
